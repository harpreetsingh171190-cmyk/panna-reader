name: Panna Android build
on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      # ubuntu-latest already ships the Android SDK (platform 34, build-tools 34.0.0, licenses accepted),
      # so no separate SDK setup step is needed.
      # Uses an explicit, current Gradle instead of the legacy committed wrapper JAR.
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.5'
      - name: Pure-Java logic checks
        run: bash checks/panna-check.sh
      - name: Lint and debug APK
        run: gradle :reader:lintDebug :reader:assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: PannaReader-debug-apk
          path: reader/build/outputs/apk/debug/*.apk
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: PannaReader-lint-report
          path: reader/build/reports/lint-results-debug.html
          if-no-files-found: ignore
