// Flat single-module layout: all Java sources and the manifest sit next to this file;
// only the two resource files live under res/.
plugins { id 'com.android.application' version '8.2.2' }
android {
    namespace 'com.harpreet.panna'
    compileSdk 34
    defaultConfig {
        applicationId 'com.harpreet.panna'
        minSdk 23
        targetSdk 34
        versionCode 5
        versionName '1.4.0'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    sourceSets {
        main {
            manifest.srcFile 'AndroidManifest.xml'
            java.srcDirs = ['.']
            java.filter.include 'Panna*.java'   // app classes only; the *Check.java test programs are excluded
            res.srcDirs = ['res']
        }
    }
    buildTypes { release { minifyEnabled false } }
    lint {
        abortOnError true
        warningsAsErrors false
        checkReleaseBuilds false
    }
}
